<!DOCTYPE html>
<!--
  Retro-futurism - social / OpenGraph share card. Body is EXACTLY 1200x630px.
  Same hand as ../og-image.html (palette, floor, footer labels) and the Law's
  card: the page's thesis, the one sentence it turns on, set as the card's
  whole subject in the wordmark's double-line frame - magenta rail left, cyan
  rail right - over the synthwave floor, the horizon the old future drew.

  Render to og-image.png with headless Chrome:
    chrome --headless=new --screenshot=og-image.png --window-size=1200,630 \
           --force-device-scale-factor=2 --hide-scrollbars \
           --virtual-time-budget=5000 file://$PWD/og-image.html
  then downscale the 2400x1260 capture to 1200x630 (sips -z 630 1200). No deps.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Retro-futurism - share card</title>
<style>
  :root {
    --magenta:#ff5fff; --rose:#ff5fd7; --pink:#d75fd7; --purple:#af5fff;
    --indigo:#875fff;  --blue:#5fafff; --cyan:#00d7ff; --brtcyan:#00ffff;
    --accent:#00afff;
    --ramp: linear-gradient(100deg,
      var(--magenta), var(--pink), var(--purple), var(--indigo),
      var(--blue), var(--cyan), var(--brtcyan));
    --bg:#0a0a12; --ink:#e8e8f4; --dim:#8a8aa6; --rail:#2a2a3e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background:
      radial-gradient(900px 520px at 6% -12%, color-mix(in srgb, var(--magenta) 14%, transparent), transparent 58%),
      radial-gradient(1100px 620px at 50% -18%, #1a1030 0%, transparent 60%),
      var(--bg);
    color: var(--ink);
    font: 16px/1.5 ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    position: relative;
  }

  /* A faint synthwave grid floor for depth - recedes into the dark. */
  .floor {
    position: absolute; left: 0; right: 0; bottom: 0; height: 230px;
    background-image:
      linear-gradient(to right,  color-mix(in srgb, var(--purple) 22%, transparent) 1px, transparent 1px),
      linear-gradient(to bottom, color-mix(in srgb, var(--cyan)   22%, transparent) 1px, transparent 1px);
    background-size: 64px 44px;
    transform: perspective(420px) rotateX(62deg);
    transform-origin: bottom center;
    mask-image: linear-gradient(to top, #000 0%, transparent 92%);
    -webkit-mask-image: linear-gradient(to top, #000 0%, transparent 92%);
    opacity: .5;
  }

  /* CRT scanlines, faint - the house texture. */
  .scan {
    position: absolute; inset: 0; pointer-events: none; z-index: 3;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 1px, transparent 1px 3px);
    mix-blend-mode: multiply;
  }

  .stage { position: absolute; left: 64px; right: 64px; top: 150px; z-index: 2; }
  .kicker {
    color: var(--cyan); font-size: 17px; letter-spacing: .34em; text-transform: uppercase;
    margin-bottom: 44px;
  }
  .kicker .b { color: var(--dim); }

  /* The thesis, in the wordmark's frame - the page's hero, the card's subject. */
  .thesis {
    position: relative; padding: 50px 44px 44px;
    border: 4px double color-mix(in srgb, var(--purple) 34%, var(--rail));
    border-left-color:  color-mix(in srgb, var(--magenta) 72%, var(--rail));
    border-right-color: color-mix(in srgb, var(--cyan)    72%, var(--rail));
    border-radius: 18px;
    background:
      radial-gradient(700px 260px at 50% 0%, color-mix(in srgb, var(--purple) 10%, transparent), transparent 70%),
      rgba(6,6,8,.72);
    box-shadow: 0 0 80px -20px var(--purple), inset 0 0 70px -40px var(--magenta);
  }
  .legend {
    position: absolute; top: 0; left: 44px; transform: translateY(-50%);
    padding: 0 14px; line-height: 1.4; background: #0e0b1a; border-radius: 6px;
    color: color-mix(in srgb, var(--ink) 70%, var(--dim));
    font-size: 16px; letter-spacing: .3em; text-transform: uppercase;
  }
  .legend .b { color: var(--accent); }
  .say {
    width: fit-content;
    font-size: 44px; font-weight: 800; line-height: 1.18; letter-spacing: -.015em;
    background: var(--ramp); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter:
      drop-shadow(-2.5px 0 0 color-mix(in srgb, var(--magenta) 60%, transparent))
      drop-shadow( 2.5px 0 0 color-mix(in srgb, var(--cyan)    60%, transparent))
      drop-shadow(0 0 22px color-mix(in srgb, var(--purple) 38%, transparent));
  }
  /* Two sentences, one per line: the break is set by hand between them, never
     mid-clause, and "half-built" (the line's key word) never splits at its hyphen. */
  .say .nb { white-space: nowrap; }
  .say::after {
    content: ""; display: inline-block; width: .5em; height: .86em;
    margin-left: .14em; vertical-align: -.08em;
    background: var(--accent); border-radius: 2px;
  }

  /* Bottom-left wordmark + bottom-right motto, like a brand sheet footer. */
  .label {
    position: absolute; bottom: 34px; z-index: 2;
    font-size: 17px; letter-spacing: .26em; text-transform: uppercase;
    color: var(--dim);
  }
  .label.left  { left: 64px; }
  .label.right { right: 64px; }
  .label .motto {
    background: var(--ramp);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    font-weight: 700;
  }
</style>
</head>
<body>
  <div class="floor"></div>
  <div class="scan"></div>

  <div class="stage">
    <div class="kicker"><span class="b">[</span> Y3K Lab &middot; The purpose <span class="b">]</span></div>
    <div class="thesis">
      <div class="legend"><span class="b">[</span> The through-line <span class="b">]</span></div>
      <div class="say">The future arrived <span class="nb">half-built</span>.<br>I am building what we were promised.</div>
    </div>
  </div>

  <div class="label left">Y3K Lab &middot; Retro-futurism</div>
  <div class="label right"><span class="motto">Nostalgia, pointed forward</span></div>
</body>
</html>
